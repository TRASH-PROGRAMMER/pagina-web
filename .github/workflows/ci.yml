name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q SEVER tests

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: ci-secret-key-with-at-least-32-characters
          TESTING: "true"
          DB_BACKUP_ENABLED: "false"
          FLASK_ENV: testing
        run: python -m pytest -q

      - name: Run lint
        run: python -m ruff check SEVER tests --select E9,F --ignore F401

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt