name: Deploy to Server (Docker)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preflight - validate SSH connectivity
        run: |
          set -e
          echo "Checking TCP connectivity to ${SERVER_HOST}:${SERVER_PORT}"
          nc -vz -w 10 "${SERVER_HOST}" "${SERVER_PORT}"
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}

      - name: Validate deployment secrets
        shell: bash
        env:
          SECRET_KEY: ${{ secrets.SECRETO_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SECRET_KEY" ] || [ "${#SECRET_KEY}" -lt 32 ]; then
            echo "SECRETO_KEY must contain at least 32 characters."
            exit 1
          fi
          echo "SECRET_KEY validation passed."

      - name: Copy project files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "requirements.txt,SEVER/,Dockerfile,docker-compose.yml,.dockerignore"
          target: /home/${{ secrets.SERVER_USER }}/pagina-web
          overwrite: true
          timeout: 120s
          command_timeout: 10m
          debug: true

      - name: Deploy via SSH with Docker
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 120s
          command_timeout: 20m
          debug: true
          envs: SECRET_KEY,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET
        env:
          SECRET_KEY: ${{ secrets.SECRETO_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          script: |
            set -e
            APP_DIR="/home/${{ secrets.SERVER_USER }}/pagina-web"
            cd "$APP_DIR"

            # ── 1. Crear .ENV con secretos ──
            printf 'SECRET_KEY=%s\nCLOUDINARY_CLOUD_NAME=%s\nCLOUDINARY_API_KEY=%s\nCLOUDINARY_API_SECRET=%s\n' \
              "$SECRET_KEY" \
              "$CLOUDINARY_CLOUD_NAME" \
              "$CLOUDINARY_API_KEY" \
              "$CLOUDINARY_API_SECRET" > "$APP_DIR/.ENV"

            # Quitar espacios en blanco al inicio de cada línea
            sed -i 's/^[[:space:]]*//' "$APP_DIR/.ENV"

            # ── 2. Build y deploy con Docker Compose ──
            docker compose down || true
            docker compose up -d --build

            echo "Deploy completado. Contenedores activos:"
            docker compose ps
